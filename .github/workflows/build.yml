# Builds lid-classpassives.dll (a plugin for the LiD Plugin Loader) from the source in
# this repository and runs the tests on every push. Pushing a tag such as v2.0.0
# also publishes a release: the plugin built here, the Fighter Class Passives
# mod, their SHA-256 sums and a signed record (attestation) tying the DLL to
# this workflow run and commit.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Zig
        run: python -m pip install ziglang==0.16.0

      - name: Build and test lid-classpassives.dll
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python build.py --test --package --tag $env:GITHUB_REF_NAME
          } else {
            python build.py --test --package
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item out/lid-classpassives.dll release/
          Copy-Item out/LiD-Fighter-Class-Passives.zip release/
          $sums = Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/lid-classpassives.dll
            release/LiD-Fighter-Class-Passives.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Built by GitHub Actions from commit ${GITHUB_SHA} - [build log and tests](${RUN_URL})."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            tr -d '\r' < release/SHA256SUMS.txt | awk -v q='`' '{ printf "| %s | %s%s%s |\n", $2, q, $1, q }'
            echo
            echo "**Check the DLL is the one built here**, with the [GitHub CLI](https://cli.github.com/):"
            echo
            echo '```'
            echo "gh attestation verify lid-classpassives.dll --repo ${REPO}"
            echo '```'
            echo
            echo "Or rebuild it yourself and compare the SHA-256 - see **Building it yourself** in the README."
          } > notes.md
          files="release/lid-classpassives.dll release/LiD-Fighter-Class-Passives.zip release/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # made on the website: add the files to it
            gh release upload "$TAG" $files --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" $files --repo "$REPO" --title "$TAG" --notes-file notes.md
          fi
